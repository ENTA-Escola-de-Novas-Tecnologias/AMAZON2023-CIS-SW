---

- name: Apply Amazon Linux 2023 CIS hardening
  hosts: all
  become: true

  roles:

      - role: "{{ playbook_dir }}"

  post_tasks:
    - name: "1.1.1.1 | PATCH | Ensure mounting of squashfs filesystems is disabled"
      block:
        - name: "1.1.1.1 | PATCH | Ensure mounting of squashfs filesystems is disabled | Edit modprobe config"
          ansible.builtin.lineinfile:
            path: /etc/modprobe.d/CIS.conf
            regexp: "^(#)?install squashfs(\\s|$)"
            line: "install squashfs /bin/false"
            create: true
            mode: 'u-x,go-rwx'

        - name: "1.1.1.1 | PATCH | Ensure mounting of squashfs filesystems is disabled | blacklist"
          ansible.builtin.lineinfile:
            path: /etc/modprobe.d/blacklist.conf
            regexp: "^(#)?blacklist squashfs(\\s|$)"
            line: "blacklist squashfs"
            create: true
            mode: 'u-x,go-rwx'

        - name: "1.1.1.1 | PATCH | Ensure mounting of squashfs filesystems is disabled | Disable squashfs"
          community.general.modprobe:
            name: squashfs
            state: absent
          when: not system_is_container

      when:
        - amzn2023cis_rule_1_1_1_1
      tags:
        - level2-server
        - patch
        - rule_1.1.1.1
        - squashfs
        - NIST800-53R5_CM-7

    - name: "1.1.1.2 | PATCH | Ensure mounting of udf filesystems is disabled"
      block:
        - name: "1.1.1.2 | PATCH | Ensure mounting of udf filesystems is disable | Edit modprobe config"
          ansible.builtin.lineinfile:
            path: /etc/modprobe.d/CIS.conf
            regexp: "^(#)?install udf(\\s|$)"
            line: "install udf /bin/false"
            create: true
            mode: 'u-x,go-rwx'

        - name: "1.1.1.2 | PATCH | Ensure mounting of udf filesystems is disabled | blacklist"
          ansible.builtin.lineinfile:
            path: /etc/modprobe.d/blacklist.conf
            regexp: "^(#)?blacklist udf(\\s|$)"
            line: "blacklist udf"
            create: true
            mode: 'u-x,go-rwx'

        - name: "1.1.1.2 | PATCH | Ensure mounting of udf filesystems is disable | Disable udf"
          community.general.modprobe:
            name: udf
            state: absent
          when: not system_is_container
      when:
        - amzn2023cis_rule_1_1_1_2
      tags:
        - level2-server
        - patch
        - rule_1.1.1.2
        - udf

    - name: "5.1.1.3 | PATCH | Ensure journald is configured to send logs to rsyslog"
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf
        regexp: "^#ForwardToSyslog=|^ForwardToSyslog="
        line: ForwardToSyslog=yes
      notify: Restart rsyslog
      when:
        - amzn2023cis_rule_5_1_1_3
        - amzn2023cis_syslog_service == "rsyslog"
      tags:
        - level1-server
        - patch
        - rsyslog
        - rule_5.1.1.3
        - NIST800-53R5_AC-3
        - NIST800-53R5_AU-2
        - NIST800-53R5_AU-4
        - NIST800-53R5_AU-12
        - NIST800-53R5_MP-2
        - NIST800-53R5_SI-5

    - name: "1.4.2 | PATCH | Ensure /boot/grub/grub.cfg exists with correct perms"
      block:

        - name: Ensure /boot/grub directory exists
          ansible.builtin.file:
            path: /boot/grub
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Create empty /boot/grub/grub.cfg if missing
          ansible.builtin.file:
            path: /boot/grub/grub.cfg
            state: touch
            owner: root
            group: root
            mode: '0400'